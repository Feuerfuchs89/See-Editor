# Baut ein Küstenrevier (Karte + Spieldaten) aus offenen Daten und legt die Dateien im Hauptordner ab.
# Start: GitHub → Reiter „Actions“ → „Revier bauen“ → „Run workflow“.
name: Revier bauen
on:
  workflow_dispatch:
    inputs:
      revier:
        description: 'Revier (Schlüssel in revier_bauen.py)'
        required: true
        default: 'ruegen'
      neu_laden:
        description: 'Alle Daten neu herunterladen (sonst Zwischenspeicher vom letzten Lauf nutzen)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REVIER: ${{ inputs.revier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pakete installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install numpy scipy requests pillow tifffile imagecodecs
      - name: Zwischenspeicher holen
        if: ${{ !inputs.neu_laden }}
        uses: actions/cache/restore@v4
        with:
          path: .revier-cache
          key: revier-${{ inputs.revier }}-${{ github.run_id }}
          restore-keys: revier-${{ inputs.revier }}-
      - name: Revier bauen
        run: python -u revier_bauen.py "$REVIER"
      - name: Zwischenspeicher sichern (auch bei Abbruch)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .revier-cache
          key: revier-${{ inputs.revier }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- ":(glob)${REVIER}-*"
          git commit -m "Revier $REVIER neu gebaut" || echo "Keine Änderungen"
          git push
